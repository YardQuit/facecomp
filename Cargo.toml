[package]
name = "facecomp"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Compare faces across photos and report a percentage match, usable standalone or from Emacs"
repository = "https://github.com/YardQuit/facecomp"

[[bin]]
name = "facecomp"
path = "src/main.rs"

[lib]
name = "facecomp"
path = "src/lib.rs"

[dependencies]
dlib-face-recognition = { version = "0.3.2", default-features = false, features = ["build-native"] }
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
