name: Build AppImage

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    # Built on the oldest LTS GitHub still offers, since glibc is
    # forward-compatible only: a binary built on newer glibc won't run on
    # older systems, but one built on an older glibc runs fine everywhere newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential clang libclang-dev \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev zlib1g-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # OpenCV older than ~4.10 (including every version Ubuntu's own apt
      # repos ship) fails at *runtime* trying to load the YuNet detector
      # model below - see the README's system requirements section - so a
      # modern OpenCV has to be built from source. Minimal module set to
      # keep this from-source build's time down; cached across runs since
      # it's the same version/config every time.
      - name: Cache OpenCV build
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: opencv-install
          # The module list is part of this key on purpose. Adding a module
          # without changing it restores an OpenCV built without that module
          # and the Rust build then fails on missing headers, which reads as a
          # code error rather than a stale cache.
          key: opencv-4.10.0-objdetect-dnn-calib3d-v2

      - name: Build OpenCV from source
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git /tmp/opencv-src
          cmake -S /tmp/opencv-src -B /tmp/opencv-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/opencv-install" \
            -DBUILD_LIST=core,imgproc,imgcodecs,objdetect,dnn,calib3d \
            -DBUILD_SHARED_LIBS=ON \
            -DOPENCV_GENERATE_PKGCONFIG=ON \
            -DBUILD_opencv_python2=OFF -DBUILD_opencv_python3=OFF \
            -DBUILD_JAVA=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF \
            -DWITH_GTK=OFF -DWITH_QT=OFF -DWITH_FFMPEG=OFF -DWITH_1394=OFF \
            -DWITH_GSTREAMER=OFF -DWITH_OPENEXR=OFF -DWITH_TBB=OFF \
            -DWITH_IPP=OFF -DWITH_CUDA=OFF
          cmake --build /tmp/opencv-build -j"$(nproc)" --target install
          rm -rf /tmp/opencv-src /tmp/opencv-build

      - name: Export OpenCV environment
        run: |
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/opencv-install/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/opencv-install/lib" >> "$GITHUB_ENV"

      # Runs before anything is packaged, so a broken landmark ordering stops
      # the build rather than shipping. --all-targets so the examples are
      # compiled too - ordering_check.rs is the tool that measured the numbers
      # tests/arcface_alignment.rs encodes, and it should not be allowed to rot.
      - name: Run tests
        run: cargo test --all-targets

      - name: Cache model files
        id: cache-models
        uses: actions/cache@v4
        with:
          path: models
          key: facecomp-models-yunet-sface-arcface-v2

      # YuNet and SFace come from OpenCV Zoo, ArcFace from the ONNX Model Zoo;
      # all three are git-lfs objects, hence the media. host. The int8 ArcFace
      # build is 66MB against fp32's 261MB, for about 5% less separation - not
      # worth quadrupling the AppImage for.
      - name: Download model files
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSL -o models/face_detection_yunet_2023mar.onnx \
            https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          curl -sSL -o models/face_recognition_sface_2021dec.onnx \
            https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx
          curl -sSL -o models/arcfaceresnet100-11-int8.onnx \
            https://media.githubusercontent.com/media/onnx/models/main/validated/vision/body_analysis/arcface/model/arcfaceresnet100-11-int8.onnx

      - name: Cache packaging tools (linuxdeploy/appimagetool)
        uses: actions/cache@v4
        with:
          path: packaging/.tools
          key: appimage-tools-v1

      - name: Build AppImage
        run: |
          ./packaging/build-appimage.sh \
            models/face_detection_yunet_2023mar.onnx \
            models/face_recognition_sface_2021dec.onnx \
            models/arcfaceresnet100-11-int8.onnx

      - name: Smoke-test the AppImage
        run: ./facecomp-x86_64.AppImage --appimage-extract-and-run --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: facecomp-x86_64.AppImage
          path: facecomp-x86_64.AppImage

      # Rolling build for testers/early adopters: every push to master
      # overwrites this same pre-release's asset.
      - name: Publish continuous build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous build (master)
          prerelease: true
          body: |
            Automatically rebuilt from the latest `master` commit (${{ github.sha }}).
            Not a stable release — for testers and early adopters only.
          files: facecomp-x86_64.AppImage

      # Versioned release: attach to whatever GitHub Release was just published.
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: facecomp-x86_64.AppImage
