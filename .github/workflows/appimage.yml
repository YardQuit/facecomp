name: CI

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Split out from `build` so pull requests get checked without packaging a
  # ~91MB AppImage they'd only throw away. It also means a broken landmark
  # ordering fails review rather than being discovered after the merge.
  test:
    # Same runner as `build`: the point of testing is to test what ships.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-opencv

      # --all-targets so the examples compile too. ordering_check.rs is the tool
      # that measured the numbers tests/arcface_alignment.rs encodes, and it
      # should not be allowed to rot.
      - name: Run tests
        run: cargo test --all-targets

  build:
    # Gated on `test`, so nothing is ever packaged or published from a tree
    # whose tests fail. This also serialises the two jobs, which means `build`
    # reuses the OpenCV that `test` just cached rather than racing it for the
    # same key.
    needs: test
    # Pull requests stop at `test`. Packaging is only useful for something
    # that's going to be published.
    if: github.event_name != 'pull_request'
    # Built on the oldest LTS GitHub still offers, since glibc is
    # forward-compatible only: a binary built on newer glibc won't run on
    # older systems, but one built on an older glibc runs fine everywhere newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-opencv

      - name: Cache model files
        id: cache-models
        uses: actions/cache@v4
        with:
          path: models
          key: facecomp-models-yunet-sface-arcface-v2

      # YuNet and SFace come from OpenCV Zoo, ArcFace from the ONNX Model Zoo;
      # all three are git-lfs objects, hence the media. host. The int8 ArcFace
      # build is 66MB against fp32's 261MB, for about 5% less separation - not
      # worth quadrupling the AppImage for.
      - name: Download model files
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSL -o models/face_detection_yunet_2023mar.onnx \
            https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          curl -sSL -o models/face_recognition_sface_2021dec.onnx \
            https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx
          curl -sSL -o models/arcfaceresnet100-11-int8.onnx \
            https://media.githubusercontent.com/media/onnx/models/main/validated/vision/body_analysis/arcface/model/arcfaceresnet100-11-int8.onnx

      - name: Cache packaging tools (linuxdeploy/appimagetool)
        uses: actions/cache@v4
        with:
          path: packaging/.tools
          key: appimage-tools-v1

      - name: Build AppImage
        run: |
          ./packaging/build-appimage.sh \
            models/face_detection_yunet_2023mar.onnx \
            models/face_recognition_sface_2021dec.onnx \
            models/arcfaceresnet100-11-int8.onnx

      - name: Smoke-test the AppImage
        run: ./facecomp-x86_64.AppImage --appimage-extract-and-run --help

      # Manual runs only. Every other event that reaches `build` publishes the
      # AppImage to a release moments later, and release assets are free -
      # workflow artifacts are not. They count toward the account's Actions
      # storage quota (500MB on the free plan), and at 90MiB a run with the
      # 90-day default retention, three days of pushes tripped the 90% usage
      # warning. workflow_dispatch is the one event with nowhere else to put
      # the file, so it keeps the artifact, briefly.
      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: facecomp-x86_64.AppImage
          path: facecomp-x86_64.AppImage
          retention-days: 7

      # Rolling build for testers/early adopters: every push to master
      # overwrites this same pre-release's asset.
      - name: Publish continuous build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous build (master)
          prerelease: true
          body: |
            Automatically rebuilt from the latest `master` commit (${{ github.sha }}).
            Not a stable release — for testers and early adopters only.
          files: facecomp-x86_64.AppImage

      # Versioned release: attach to whatever GitHub Release was just published.
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: facecomp-x86_64.AppImage

  # Bounds artifact storage at the 5 newest, deleting the rest. Retention
  # alone can't do that: it expires artifacts by age, so a burst of builds
  # still stacks up 90MiB copies until the account quota complains, which is
  # how 21 of them got retained at once. Runs after `build` so the artifact
  # this run may have just uploaded is the newest of the survivors, and is
  # skipped alongside it on pull requests.
  cleanup-artifacts:
    needs: build
    runs-on: ubuntu-22.04
    # Deleting artifacts needs actions: write, which the workflow-level
    # `contents: write` grant doesn't cover. Job-level so the packaging jobs
    # don't carry a scope they never use.
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const keep = 5;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const stale = artifacts
              .filter(a => !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(keep);
            for (const a of stale) {
              core.info(`deleting ${a.name} #${a.id} of ${a.created_at}, ` +
                        `${(a.size_in_bytes / 1048576).toFixed(1)} MiB`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id,
              });
            }
            core.info(`deleted ${stale.length}, kept the newest ${Math.min(keep, artifacts.length - stale.length)}`);
